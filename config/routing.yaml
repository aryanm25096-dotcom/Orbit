guardrails:
  max_tool_calls: 30
  max_retries: 3
  max_recovery_loops: 3
  test_timeout_sec: 120
stage_a:
  default_model: meta-llama/Meta-Llama-3.1-8B-Instruct
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
stage_b:
  enabled: false
  roles:
    architect:
      model: deepseek-coder-v2:latest
      provider: ollama
      base_url: http://localhost:11434
    database:
      model: deepseek-coder-v2:latest
      provider: ollama
      base_url: http://localhost:11434
    backend:
      model: deepseek-coder-v2:latest
      provider: ollama
      base_url: http://localhost:11434
    frontend:
      model: deepseek-coder-v2:latest
      provider: ollama
      base_url: http://localhost:11434
    reviewer:
      model: deepseek-coder-v2:latest
      provider: ollama
      base_url: http://localhost:11434
